name: Trix AI Android 10+ Accessibility Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Trix AI project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q TrixAI-Android10plus-Accessibility.zip -d project

          if [ -d "project/trixfix" ]; then
            cp -r project/trixfix/. project/
          fi

          echo "Project root:"
          ls -la project
          echo "App module:"
          ls -la project/app

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify JVM targets
        working-directory: project
        run: |
          grep -n -E "compileOptions|sourceCompatibility|targetCompatibility|jvmTarget" app/build.gradle.kts || true

      - name: Build Trix AI APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trix-AI-Android10plus-Accessibility
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
